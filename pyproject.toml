[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-wizard"
version = "0.1.0"
description = "A command-line tool that converts files between formats (CSV, JSON, YAML, XML, Markdown, TOML)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.1",
    "PyYAML>=6.0.3",
    "toml>=0.10.2",
    "xmltodict>=1.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wizard = "wizard.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"
